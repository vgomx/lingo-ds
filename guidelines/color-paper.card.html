<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Paper — light surfaces</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-app);font-family:var(--font-ui);color:var(--text-body)}
.g{display:flex;gap:10px;flex-wrap:wrap}.sw{border-radius:var(--radius-md);height:64px;flex:1;min-width:60px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;gap:2px}
.n{font-size:10px;font-weight:800;letter-spacing:.04em}.v{font-family:var(--font-mono);font-size:9px;opacity:.7}
.lbl{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint)}
</style></head><body><div class="g"><div class="sw" style="background:var(--paper-0);color:#14141C;box-shadow:inset 0 0 0 1px rgba(20,20,28,.10)"><span class="n">0</span><span class="v">--paper-0</span></div><div class="sw" style="background:var(--paper-50);color:#14141C;box-shadow:inset 0 0 0 1px rgba(20,20,28,.10)"><span class="n">50</span><span class="v">--paper-50</span></div><div class="sw" style="background:var(--paper-100);color:#14141C;box-shadow:inset 0 0 0 1px rgba(20,20,28,.10)"><span class="n">100</span><span class="v">--paper-100</span></div><div class="sw" style="background:var(--paper-200);color:#14141C;box-shadow:inset 0 0 0 1px rgba(20,20,28,.10)"><span class="n">200</span><span class="v">--paper-200</span></div><div class="sw" style="background:var(--paper-300);color:#14141C;box-shadow:inset 0 0 0 1px rgba(20,20,28,.10)"><span class="n">300</span><span class="v">--paper-300</span></div></div></body></html>
