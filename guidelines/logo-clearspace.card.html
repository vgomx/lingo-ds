<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Clear space & minimum size</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-app);font-family:var(--font-ui);color:var(--text-body)}
.g{display:flex;gap:10px;flex-wrap:wrap}.sw{border-radius:var(--radius-md);height:64px;flex:1;min-width:60px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;gap:2px}
.n{font-size:10px;font-weight:800;letter-spacing:.04em}.v{font-family:var(--font-mono);font-size:9px;opacity:.7}
.lbl{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint)}
</style></head><body><div class="g" style="gap:30px;align-items:flex-end">
<div style="position:relative;padding:26px;background:var(--surface-card);border-radius:var(--radius-lg);box-shadow:inset 0 0 0 1px var(--border)">
<span style="position:absolute;inset:26px;box-shadow:0 0 0 1px var(--violet-400);border-radius:2px"></span>
<img src="../assets/logo/logo-wordmark-white.svg" style="height:52px;position:relative"></div>
<div style="display:flex;align-items:flex-end;gap:14px">
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><img src="../assets/logo/logo-wordmark-white.svg" style="height:26px"><span class="v">96px min</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><img src="../assets/logo/mark-light.svg" style="height:24px"><span class="v">24px min</span></div></div></div></body></html>
