<!-- @dsCard group="Colors" viewport="700x150" name="Tool accents" subtitle="One hue per tool — used on card stripes, rails and tags" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Tool accents</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-app);font-family:var(--font-ui);color:var(--text-body)}
.g{display:flex;gap:10px;flex-wrap:wrap}.sw{border-radius:var(--radius-md);height:64px;flex:1;min-width:60px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;gap:2px}
.n{font-size:10px;font-weight:800;letter-spacing:.04em}.v{font-family:var(--font-mono);font-size:9px;opacity:.7}
.lbl{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint)}
</style></head><body><div class="g"><div class="sw" style="background:var(--tool-flashcards);color:#14141C"><span class="n">Flashcards</span><span class="v">--tool-flashcards</span></div><div class="sw" style="background:var(--tool-etymology);color:#14141C"><span class="n">Etymology</span><span class="v">--tool-etymology</span></div><div class="sw" style="background:var(--tool-conjugation);color:#14141C"><span class="n">Conjugation</span><span class="v">--tool-conjugation</span></div><div class="sw" style="background:var(--tool-phrasebook);color:#14141C"><span class="n">Phrasebook</span><span class="v">--tool-phrasebook</span></div><div class="sw" style="background:var(--tool-grammar);color:#14141C"><span class="n">Grammar</span><span class="v">--tool-grammar</span></div></div></body></html>
