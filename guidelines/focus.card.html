<!-- @dsCard group="Elevation" viewport="700x150" name="Focus & selection" subtitle="3px violet ring outside, 1.5px inset inside" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Focus & selection</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-app);font-family:var(--font-ui);color:var(--text-body)}
.g{display:flex;gap:10px;flex-wrap:wrap}.sw{border-radius:var(--radius-md);height:64px;flex:1;min-width:60px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;gap:2px}
.n{font-size:10px;font-weight:800;letter-spacing:.04em}.v{font-family:var(--font-mono);font-size:9px;opacity:.7}
.lbl{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint)}
</style></head><body><div class="g" style="gap:18px;align-items:center">
<span style="height:36px;width:170px;border-radius:8px;background:var(--surface-input);box-shadow:inset 0 0 0 1px var(--border);display:flex;align-items:center;padding:0 12px;font-size:14px;color:var(--text-faint)">rest</span>
<span style="height:36px;width:170px;border-radius:8px;background:var(--surface-input);box-shadow:inset 0 0 0 1.5px var(--brand),0 0 0 3px var(--brand-ring);display:flex;align-items:center;padding:0 12px;font-size:14px;color:var(--text-strong)">focused</span>
<span style="height:36px;width:170px;border-radius:8px;background:var(--surface-input);box-shadow:inset 0 0 0 1.5px var(--danger);display:flex;align-items:center;padding:0 12px;font-size:14px;color:var(--text-strong)">error</span></div></body></html>
