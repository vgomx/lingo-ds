<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Control heights</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-app);font-family:var(--font-ui);color:var(--text-body)}
.g{display:flex;gap:10px;flex-wrap:wrap}.sw{border-radius:var(--radius-md);height:64px;flex:1;min-width:60px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;gap:2px}
.n{font-size:10px;font-weight:800;letter-spacing:.04em}.v{font-family:var(--font-mono);font-size:9px;opacity:.7}

</style></head><body><div class="g" style="align-items:center"><span style="height:28px;padding:0 12px;border-radius:8px;background:var(--brand);box-shadow:0 3px 0 var(--violet-700);color:#fff;font-weight:700;font-size:13px;display:inline-flex;align-items:center">sm · 28px</span><span style="height:36px;padding:0 16px;border-radius:8px;background:var(--brand);box-shadow:0 3px 0 var(--violet-700);color:#fff;font-weight:700;font-size:14px;display:inline-flex;align-items:center">md · 36px</span><span style="height:44px;padding:0 22px;border-radius:8px;background:var(--brand);box-shadow:0 3px 0 var(--violet-700);color:#fff;font-weight:700;font-size:16px;display:inline-flex;align-items:center">lg · 44px</span><span style="height:52px;padding:0 28px;border-radius:8px;background:var(--brand);box-shadow:0 3px 0 var(--violet-700);color:#fff;font-weight:700;font-size:18px;display:inline-flex;align-items:center">xl · 52px</span></div></body></html>
