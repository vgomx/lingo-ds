<!-- @dsCard group="Elevation" viewport="700x150" name="Chunky press edge" subtitle="3px solid bottom edge compresses to 1px on press" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Chunky press edge</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-app);font-family:var(--font-ui);color:var(--text-body)}
.g{display:flex;gap:10px;flex-wrap:wrap}.sw{border-radius:var(--radius-md);height:64px;flex:1;min-width:60px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;gap:2px}
.n{font-size:10px;font-weight:800;letter-spacing:.04em}.v{font-family:var(--font-mono);font-size:9px;opacity:.7}
.lbl{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint)}
</style></head><body><div class="g" style="align-items:center;gap:20px">
<span style="height:44px;padding:0 22px;border-radius:8px;background:var(--brand);box-shadow:0 3px 0 var(--violet-700);color:#fff;font-weight:700;display:inline-flex;align-items:center">rest</span>
<span style="height:44px;padding:0 22px;border-radius:8px;background:var(--brand-hover);box-shadow:0 3px 0 var(--violet-700);color:#fff;font-weight:700;display:inline-flex;align-items:center">hover</span>
<span style="height:44px;padding:0 22px;border-radius:8px;background:var(--brand-hover);box-shadow:0 1px 0 var(--violet-700);transform:translateY(1px);color:#fff;font-weight:700;display:inline-flex;align-items:center">pressed</span>
<span style="height:44px;padding:0 22px;border-radius:8px;background:var(--surface-raised);box-shadow:0 3px 0 rgba(0,0,0,.35);color:var(--text-strong);font-weight:700;display:inline-flex;align-items:center">secondary</span>
<span style="height:44px;padding:0 22px;border-radius:8px;background:var(--brand);opacity:.45;color:#fff;font-weight:700;display:inline-flex;align-items:center">disabled</span></div></body></html>
