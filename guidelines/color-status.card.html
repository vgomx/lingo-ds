<!-- @dsCard group="Colors" viewport="700x150" name="Status" subtitle="success · warning · danger · info, with subtle fills" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Status</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-app);font-family:var(--font-ui);color:var(--text-body)}
.g{display:flex;gap:10px;flex-wrap:wrap}.sw{border-radius:var(--radius-md);height:64px;flex:1;min-width:60px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;gap:2px}
.n{font-size:10px;font-weight:800;letter-spacing:.04em}.v{font-family:var(--font-mono);font-size:9px;opacity:.7}
.lbl{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint)}
</style></head><body><div class="g"><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div class="sw" style="background:var(--success);color:#14141C"><span class="n">SUCCESS</span><span class="v">--success</span></div>
<div class="sw" style="height:36px;background:var(--success-subtle);color:var(--mint-300);box-shadow:inset 0 0 0 1px currentColor"><span class="v">--success-subtle</span></div></div><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div class="sw" style="background:var(--warning);color:#14141C"><span class="n">WARNING</span><span class="v">--warning</span></div>
<div class="sw" style="height:36px;background:var(--warning-subtle);color:var(--amber-300);box-shadow:inset 0 0 0 1px currentColor"><span class="v">--warning-subtle</span></div></div><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div class="sw" style="background:var(--danger);color:#14141C"><span class="n">DANGER</span><span class="v">--danger</span></div>
<div class="sw" style="height:36px;background:var(--danger-subtle);color:var(--red-300);box-shadow:inset 0 0 0 1px currentColor"><span class="v">--danger-subtle</span></div></div><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div class="sw" style="background:var(--info);color:#14141C"><span class="n">INFO</span><span class="v">--info</span></div>
<div class="sw" style="height:36px;background:var(--info-subtle);color:var(--cyan-300);box-shadow:inset 0 0 0 1px currentColor"><span class="v">--info-subtle</span></div></div></div></body></html>
