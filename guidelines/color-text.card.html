<!-- @dsCard group="Colors" viewport="700x180" name="Text on surfaces" subtitle="strong / body / muted / faint, dark and light" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Text on surfaces</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-app);font-family:var(--font-ui);color:var(--text-body)}
.g{display:flex;gap:10px;flex-wrap:wrap}.sw{border-radius:var(--radius-md);height:64px;flex:1;min-width:60px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;gap:2px}
.n{font-size:10px;font-weight:800;letter-spacing:.04em}.v{font-family:var(--font-mono);font-size:9px;opacity:.7}
.lbl{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint)}
</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div style="background:var(--ink-700);border-radius:var(--radius-lg);padding:14px;display:flex;flex-direction:column;gap:6px">
<span style="color:var(--text-strong);font-weight:800">--text-strong · headings</span>
<span style="color:var(--text-body)">--text-body · paragraphs</span>
<span style="color:var(--text-muted);font-size:14px">--text-muted · secondary</span>
<span style="color:var(--text-faint);font-size:12px">--text-faint · meta, hints</span></div>
<div data-theme="light" style="background:var(--paper-0);border-radius:var(--radius-lg);padding:14px;display:flex;flex-direction:column;gap:6px;box-shadow:inset 0 0 0 1px rgba(20,20,28,.10)">
<span style="color:var(--text-strong);font-weight:800">--text-strong · headings</span>
<span style="color:var(--text-body)">--text-body · paragraphs</span>
<span style="color:var(--text-muted);font-size:14px">--text-muted · secondary</span>
<span style="color:var(--text-faint);font-size:12px">--text-faint · meta, hints</span></div></div></body></html>
