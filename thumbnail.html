<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Lingo Toolbox</title><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;height:100%}body{width:1280px;height:854px;display:flex;overflow:hidden}
.main{flex:1;background:var(--violet-500);display:grid;place-items:center;padding:0 40px}
.main img{max-width:82%;max-height:52%;width:auto;height:auto;display:block}
.strip{width:22%;display:flex;flex-direction:column}
.strip span{flex:1;display:block}</style></head><body>
<div class="main"><img src="assets/logo/logo-wordmark-white.svg" alt="Lingo Toolbox"></div>
<div class="strip"><span style="background:var(--amber-500)"></span><span style="background:var(--mint-500)"></span><span style="background:var(--coral-500)"></span><span style="background:var(--violet-800)"></span></div>
</body></html>
