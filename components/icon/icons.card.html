<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Icons</title><link rel="stylesheet" href="../../styles.css">
<style>body{background:var(--surface-app);margin:0;padding:20px;font-family:var(--font-ui)}#root{display:flex;flex-direction:column;gap:14px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.lbl{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint)}.col{display:flex;flex-direction:column;gap:8px}</style>
</head><body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Icon } = window.LingoToolboxDesignSystem_898611;
const NAMES=['layers','git-branch','book-open','graduation-cap','languages','spell-check','flame','trophy','target','sparkles','shuffle','repeat','volume-2','mic','search','settings','bell','calendar','clock','star','heart','quote','lightbulb','users','globe','check','x','chevron-right','plus','pencil','trash-2','play','panel-left','library-big','scroll-text'];
function Demo(){return (<>
 <div className="row" style={{gap:16,color:'var(--text-body)'}}>{NAMES.slice(0,18).map(n=><Icon key={n} name={n} size={22}/>)}</div>
 <div className="row" style={{gap:16,color:'var(--text-muted)'}}>{NAMES.slice(18).map(n=><Icon key={n} name={n} size={22}/>)}</div>
 <div className="row" style={{gap:18,marginTop:4}}>
  <span style={{color:'var(--tool-flashcards)'}}><Icon name="layers" size={26}/></span>
  <span style={{color:'var(--tool-etymology)'}}><Icon name="git-branch" size={26}/></span>
  
  <span style={{color:'var(--tool-conjugation)'}}><Icon name="spell-check" size={26}/></span>
  <span style={{color:'var(--tool-phrasebook)'}}><Icon name="message-square-quote" size={26}/></span>
  <span style={{color:'var(--streak)'}}><Icon name="flame" size={26}/></span>
 </div></>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
