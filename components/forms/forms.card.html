<!-- @dsCard group="Components" viewport="700x300" name="Form controls" subtitle="Input, Select, Checkbox, Radio, Switch" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Form controls</title><link rel="stylesheet" href="../../styles.css">
<style>body{background:var(--surface-app);margin:0;padding:20px;font-family:var(--font-ui)}#root{display:flex;flex-direction:column;gap:14px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.lbl{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint)}.col{display:flex;flex-direction:column;gap:8px}</style>
</head><body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Input, Textarea, Select, Checkbox, Radio, Switch, Icon } = window.LingoToolboxDesignSystem_898611;
function Demo(){const [mode,setMode]=React.useState('srs');return (<>
 <div className="row" style={{alignItems:'flex-start',gap:16}}>
  <div style={{width:210}}><Input label="Word or phrase" placeholder="e.g. sobremesa" iconLeft={<Icon name="search" size={16}/>}/></div>
  <div style={{width:210}}><Input label="Email" type="email" defaultValue="mara@lingo.app" error="We don't recognise that address."/></div>
   <div style={{width:280}}><Textarea label="Explanation" rows={3}
     hint="A few sentences. Leave a blank line between paragraphs."
     defaultValue={"Roughly two thirds of nouns take de.\n\nEvery plural takes de, and every diminutive takes het."}/></div>
  <div style={{width:180}}><Select label="Language" options={['Spanish','Japanese','Turkish']}/></div>
 </div>
 <div className="row" style={{gap:28,alignItems:'flex-start'}}>
  <div className="col"><Checkbox label="Autoplay audio" hint="Plays on flip" defaultChecked/><Checkbox label="Reverse cards"/></div>
  <div className="col"><Radio label="Spaced repetition" hint="Recommended" value="srs" checked={mode==='srs'} onChange={setMode}/><Radio label="Cram" value="cram" checked={mode==='cram'} onChange={setMode}/></div>
  <div className="col" style={{width:230}}><Switch label="Daily reminder" hint="20:00, every day" defaultChecked/><Switch label="Sound effects" size="sm"/></div>
 </div></>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
